name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit --file apps/mac/src-tauri/Cargo.lock
      - name: Install dependencies
        run: npm ci
      - name: Test TypeScript behavior
        run: npm run test
      - name: Check renderer
        run: npm --prefix apps/mac run check
      - name: Build native helpers
        run: |
          npm run desktop:mlx:build
          npm run desktop:mlx:stage
          npm run desktop:scheduler:build
      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/mac/src-tauri/Cargo.toml --all -- --check
      - name: Check Rust warnings
        run: |
          cargo clippy --manifest-path apps/mac/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path apps/mac/src-tauri/Cargo.toml --all-targets --features direct-release -- -D warnings
          cargo clippy --manifest-path apps/mac/src-tauri/Cargo.toml --all-targets --features app-store-release -- -D warnings
      - name: Test native host
        run: |
          cargo test --manifest-path apps/mac/src-tauri/Cargo.toml
          cargo test --manifest-path apps/mac/src-tauri/Cargo.toml --features direct-release
          cargo test --manifest-path apps/mac/src-tauri/Cargo.toml --features app-store-release
